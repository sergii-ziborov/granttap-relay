name: granttap-relay

services:
  relay:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PORT: "3201"
      DATABASE_PATH: /data/relay.sqlite3
    ports:
      - "127.0.0.1:3201:3201"
    volumes:
      - /srv/data/granttap:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3201/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
