limit_req_zone $binary_remote_addr zone=granttap_relay_ip:10m rate=500r/s;
limit_req_zone $binary_remote_addr zone=granttap_pair_ip:10m rate=20r/s;
limit_req_zone $server_name zone=granttap_relay_global:1m rate=1200r/s;
limit_conn_zone $binary_remote_addr zone=granttap_pair_connections:10m;
limit_conn_zone $binary_remote_addr zone=granttap_push_connections:10m;
limit_conn_zone $binary_remote_addr zone=granttap_ws_connections:10m;
limit_req_zone $binary_remote_addr zone=granttap_task_ip:10m rate=20r/s;
limit_req_zone $server_name zone=granttap_task_global:1m rate=300r/s;
limit_conn_zone $binary_remote_addr zone=granttap_task_connections:10m;

map $http_authorization $granttap_auth_shape {
    default 0;
    "~^Bearer [a-f0-9]{64}$" 1;
}

map $http_authorization $granttap_task_auth_shape {
    default 0;
    "~^Bearer [a-f0-9]{64}$" 1;
    "~^Bearer writer:[A-Za-z0-9][A-Za-z0-9_-]{7,119}:[a-f0-9]{64}$" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.granttap.com;

    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay.granttap.com;

    ssl_certificate /etc/letsencrypt/live/relay.granttap.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.granttap.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GrantTapSSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    access_log off;
    error_log /var/log/nginx/granttap-relay-error.log warn;
    client_header_timeout 3s;
    client_body_timeout 5s;
    keepalive_timeout 10s;
    send_timeout 15s;
    client_max_body_size 40k;
    limit_conn_status 429;
    limit_req_status 429;

    location = /health {
        limit_req zone=granttap_pair_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:3201;
    }

    location ~ "^/pair/[a-f0-9]{32}$" {
        # One Mac can hold a pairing socket, a mailbox PUT, and a few HEAD
        # peeks at once. A limit of 4 turns those into HTTP 503 and the
        # phone never receives a QR it can claim.
        limit_conn granttap_pair_connections 32;
        limit_req zone=granttap_pair_ip burst=40 nodelay;
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location = /endpoint {
        if ($granttap_auth_shape = 0) { return 444; }
        client_max_body_size 12k;
        limit_conn granttap_push_connections 8;
        limit_req zone=granttap_pair_ip burst=20 nodelay;
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location ~ ^/push/(register|status)$ {
        if ($granttap_auth_shape = 0) { return 444; }
        limit_conn granttap_push_connections 8;
        limit_req zone=granttap_relay_ip burst=100 nodelay;
        limit_req zone=granttap_relay_global burst=1200 nodelay;
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location ~ "^/task-jobs(?:/[A-Za-z0-9][A-Za-z0-9_-]{7,119}(?:/(claim|finish))?)?$" {
        if ($granttap_task_auth_shape = 0) { return 444; }
        client_max_body_size 22m;
        limit_conn granttap_task_connections 8;
        limit_req zone=granttap_task_ip burst=40 nodelay;
        limit_req zone=granttap_task_global burst=100 nodelay;
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ "^/(task-job-writers|task-resources|task-job-configurations)/[A-Za-z0-9][A-Za-z0-9_-]{7,119}$" {
        if ($granttap_task_auth_shape = 0) { return 444; }
        client_max_body_size 100k;
        limit_conn granttap_task_connections 8;
        limit_req zone=granttap_task_ip burst=40 nodelay;
        limit_req zone=granttap_task_global burst=100 nodelay;
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = / {
        # Fleet devices and controllers can share one NAT address.
        # Coarse network ceiling. Verified account/device quotas run at relay.
        limit_conn granttap_ws_connections 1024;
        limit_req zone=granttap_relay_ip burst=200 nodelay;
        limit_req zone=granttap_relay_global burst=1200 nodelay;
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }

    # iPhone opens /ws. Without this location nginx 444s the scan hook.
    location = /ws {
        # Coarse network ceiling. Verified account/device quotas run at relay.
        limit_conn granttap_ws_connections 1024;
        limit_req zone=granttap_relay_ip burst=200 nodelay;
        limit_req zone=granttap_relay_global burst=1200 nodelay;
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }

    location / { return 444; }
}
