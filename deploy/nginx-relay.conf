limit_req_zone $binary_remote_addr zone=granttap_relay_ip:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=granttap_pair_ip:10m rate=2r/s;
limit_req_zone $server_name zone=granttap_relay_global:1m rate=1200r/s;

map $http_authorization $granttap_auth_shape {
    default 0;
    "~^Bearer [a-f0-9]{64}$" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.granttap.com;

    access_log off;
    error_log /var/log/nginx/granttap-relay-error.log warn;
    client_header_timeout 3s;
    client_body_timeout 5s;
    keepalive_timeout 10s;
    send_timeout 15s;
    client_max_body_size 40k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location = /health {
        limit_req zone=granttap_pair_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:3201;
    }

    location ~ "^/pair/[a-f0-9]{32}$" {
        limit_conn connections_per_ip 4;
        limit_req zone=granttap_pair_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location ~ ^/push/(register|status)$ {
        if ($granttap_auth_shape = 0) { return 444; }
        limit_conn connections_per_ip 8;
        limit_req zone=granttap_relay_ip burst=100 nodelay;
        limit_req zone=granttap_relay_global burst=1200 nodelay;
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location = / {
        if ($granttap_auth_shape = 0) { return 444; }
        limit_conn connections_per_ip 16;
        limit_req zone=granttap_relay_ip burst=200 nodelay;
        limit_req zone=granttap_relay_global burst=1200 nodelay;
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }

    location / { return 444; }
}
